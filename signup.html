<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BODHI Creations | Create Account</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>

<body class="login-page signup-page">
<header class="login-header">
    <a href="index.html" class="login-brand">
        <img class="login-logo" src="media/bodhi-logo.jpeg" alt="BODHI Creations">
    </a>
    <p class="tagline">BREATHE. IGNITE. TRANSFORM.</p>
</header>

<main class="login-main">
    <form class="account-form signup-form" id="signupForm" action="#" method="post">
        <span class="login-kicker">JOIN THE BODHI COMMUNITY</span>
        <h2>Create Your Account</h2>
        <p class="subtitle">Join us and make every moment special.</p>

        <div class="signup-fields">
            <div class="signup-field">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" name="firstName" autocomplete="given-name" placeholder="First name" required>
            </div>
            <div class="signup-field">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" name="lastName" autocomplete="family-name" placeholder="Last name" required>
            </div>
            <div class="signup-field signup-field-wide signup-dob-field">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob" autocomplete="bday" required>
            </div>
            <div class="signup-field signup-field-wide">
                <label for="signupEmail">Email Address</label>
                <input type="email" id="signupEmail" name="email" autocomplete="email" placeholder="you@example.com" required>
            </div>
            <div class="signup-field">
                <label for="signupPassword">Password</label>
                <input type="password" id="signupPassword" name="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required>
            </div>
            <div class="signup-field">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" minlength="8" placeholder="Re-enter password" required>
            </div>
        </div>

        <button type="submit" class="submit-button">Create Account</button>
        <p class="switch">Already have an account? <a href="login.html">Log in</a></p>
    </form>
    <a class="back-to-shop" href="index.html#shop">← Back to the candle collection</a>
</main>

<footer>
    <span>BODHI Creations | BREATHE. IGNITE. TRANSFORM.</span>
    <div class="footer-contact" aria-label="Contact BODHI Creations">
        <a href="mailto:bodhicreations333@gmail.com">Email</a>
        <a href="tel:+918484073455">Call +91 84840 73455</a>
        <a href="https://wa.me/918484073455" target="_blank" rel="noopener">WhatsApp</a>
    </div>
</footer>

<script>
const signupForm = document.getElementById("signupForm");
const signupPassword = document.getElementById("signupPassword");
const confirmPassword = document.getElementById("confirmPassword");

function validatePasswordMatch() {
    confirmPassword.setCustomValidity(
        confirmPassword.value === signupPassword.value ? "" : "Passwords do not match."
    );
}

signupPassword.addEventListener("input", validatePasswordMatch);
confirmPassword.addEventListener("input", validatePasswordMatch);
signupForm.addEventListener("submit", validatePasswordMatch);
</script>
</body>
</html>
