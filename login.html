
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BODHI Creations | Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
</head>

<body class="login-page">

<header class="login-header">
    <a href="index.html" class="login-brand">
        <img class="login-logo" src="media/bodhi-logo.jpeg" alt="BODHI Creations">
    </a>
    <p class="tagline">BREATHE. IGNITE. TRANSFORM.</p>
</header>

<main class="login-main">
    <form class="account-form" action="#" method="post">
        <span class="login-kicker">YOUR BODHI ACCOUNT</span>
        <h2>Welcome Back</h2>
        <p class="subtitle">Sign in to your BODHI Creations account.</p>

        <label for="email">Email Address</label>
        <input
            type="email"
            id="email"
            name="email"
            autocomplete="username"
            placeholder="Enter your email"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            placeholder="Enter your password"
            required
        >

        <a class="forgot" href="mailto:bodhicreations333@gmail.com?subject=Password%20help">
            Need help signing in?
        </a>

        <button type="submit" class="submit-button">Log In</button>

        <p class="switch">
            New here? <a href="index.html#shop">Explore BODHI Creations</a>
        </p>
    </form>
    <a class="back-to-shop" href="index.html#shop">← Back to the candle collection</a>
</main>

<footer>
    <span>BODHI Creations | BREATHE. IGNITE. TRANSFORM.</span>
    <div class="footer-contact" aria-label="Contact BODHI Creations">
        <a href="mailto:bodhicreations333@gmail.com">Email</a>
        <a href="tel:+918484073455">Call +91 84840 73455</a>
        <a href="https://wa.me/918484073455" target="_blank" rel="noopener">WhatsApp</a>
    </div>
</footer>

</body>
</html>
